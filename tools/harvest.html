const save = (name, dataUrl) => fetch('http://localhost:4761/save', {
  method: 'POST', headers: { 'content-type': 'application/json' },
  body: JSON.stringify({ name, dataUrl })
}).then(r => r.json());
const saveCanvas = (name, c) => save(name, c.toDataURL('image/png'));
const saveJson = (name, obj) => save(name, 'data:application/json;base64,' +
  btoa(unescape(encodeURIComponent(JSON.stringify(obj)))));

function imgToCanvas(img) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  c.getContext('2d').putImageData(img, 0, 0);
  return c;
}

const DBG = { items: [] };
function dbgAdd(label, img, boxes) {
  const c = imgToCanvas(img);
  if (boxes) {
    const ctx = c.getContext('2d');
    ctx.strokeStyle = '#f0f'; ctx.lineWidth = 1;
    boxes.forEach(b => ctx.strokeRect(b.x0 + 0.5, b.y0 + 0.5, b.x1 - b.x0, b.y1 - b.y0));
  }
  DBG.items.push({ label, c });
}
async function dbgFlush(name) {
  if (!DBG.items.length) return;
  const SCALE = 2, PAD = 26;
  let maxW = 0, totalH = 0;
  DBG.items.forEach(i => { maxW = Math.max(maxW, i.c.width * SCALE); totalH += i.c.height * SCALE + PAD; });
  const sheet = document.createElement('canvas');
  sheet.width = maxW + 260; sheet.height = totalH;
  const ctx = sheet.getContext('2d');
  ctx.fillStyle = '#333'; ctx.fillRect(0, 0, sheet.width, sheet.height);
  ctx.imageSmoothingEnabled = false;
  let cy = 0;
  for (const i of DBG.items) {
    ctx.drawImage(i.c, 240, cy, i.c.width * SCALE, i.c.height * SCALE);
    ctx.fillStyle = '#0f0'; ctx.font = 'bold 14px monospace';
    ctx.fillText(i.label, 6, cy + 16);
    cy += i.c.height * SCALE + PAD;
  }
  await saveCanvas(name, sheet);
  DBG.items = [];
}

const T = { ratingFont: [], panelFont: [], vsIcons: [], panelIcons: [], courts: [], mode1: [], mode2: [], dblIcons: [], myname: [], racketBanners: [] };
function packGlyph(label, g) { return { label, aspect: g.aspect, v: Array.from(g) }; }

// コンマは数字の懐に入り込みx順が揺れるため、「数字箱」「コンマ箱」を形状で分類してクラス別に対応付ける
function harvestText(setName, img, mode, expected, tag) {
  const opts = mode === 'fillink' ? { ...V.NUM_SEG, labels: expected } : { labels: expected };
  const glyphs = V.readGlyphs(img, mode, null, opts);
  dbgAdd(`${tag} 期待[${expected.join('')}] 検出${glyphs.length}個`, img, glyphs.map(g => g.box));
  const h = img.height;
  const isCommaBox = g => (g.box.y1 - g.box.y0 + 1) <= h * 0.3 && g.box.y0 >= h * 0.5;
  const digitGlyphs = glyphs.filter(g => !isCommaBox(g));
  const commaGlyphs = glyphs.filter(isCommaBox);
  const expDigits = expected.filter(c => c !== ',');
  const expCommas = expected.length - expDigits.length;
  if (digitGlyphs.length !== expDigits.length || commaGlyphs.length !== expCommas) {
    H.errors.push(`${tag}: expected ${expDigits.length}digits+${expCommas}commas (${expected.join('')}), got ${digitGlyphs.length}+${commaGlyphs.length}`);
    return false;
  }
  digitGlyphs.forEach((g, i) => T[setName].push(packGlyph(expDigits[i], g.glyph)));
  commaGlyphs.forEach(g => T[setName].push(packGlyph(',', g.glyph)));
  return true;
}
function harvestIcon(setName, img, name, tag, W, H_) {
  T[setName].push({ name, v: Array.from(V.iconVec(img, W, H_)) });
  dbgAdd(`${tag} = ${name}`, img);
}

async function harvestVideo(set, vi) {
  const v = document.createElement('video');
  v.muted = true; v.preload = 'auto';
  v.src = '/samples/' + encodeURIComponent(set.src);
  await new Promise((res, rej) => {
    v.addEventListener('loadedmetadata', res, { once: true });
    v.addEventListener('error', () => rej(new Error('video load error: ' + set.src)), { once: true });
  });
  log(`[v${vi}] ${set.src} ${v.videoWidth}x${v.videoHeight} ${v.duration.toFixed(1)}s`);
  const seekTo = V.makeSeeker(v);

  const events = await V.scan(v, { onProgress: (t, dur) => { H.progress = t / dur; } });
  H.eventsByVideo[set.src] = events;
  const matches = V.groupMatches(events);
  log(`[v${vi}] events: ` + events.map(e => `${e.type}@${e.t0.toFixed(0)}`).join(' '));
  log(`[v${vi}] matches: ${matches.length} (GT: ${set.matches.length})`);
  const countOk = set.vpPartial ? matches.length >= set.matches.length : matches.length === set.matches.length;
  if (!countOk) {
    H.errors.push(`[v${vi}] match count mismatch: found ${matches.length}, GT ${set.matches.length} — この動画の収穫をスキップ`);
    return;
  }
  const R = V.REGIONS;
  for (let i = 0; i < Math.min(matches.length, set.matches.length); i++) {
    const m = matches[i], gt = set.matches[i], n = `v${vi}m${i + 1}`;
    const myChar = gt.myChar ?? set.myChar;
    const court = gt.court ?? set.court;
    const isDbl = set.type === 'doubles';
    await seekTo((m.vs.t0 + m.vs.t1) / 2);
    // コート名は背景が毎回違うので白文字マスクで照合（全試合ぶん収穫して背景バリエーションを稼ぐ）
    T.courts.push({ name: court, v: Array.from(V.textVec(V.cropRegion(v, R.court), 32, 8)) });
    if (i === 0) dbgAdd(`${n} court = ${court}`, V.cropRegion(v, R.court));
    if (!isDbl) {
      harvestIcon('vsIcons', V.cropRegion(v, R.myicon), myChar, `${n} myicon`, 16, 16);
      harvestIcon('vsIcons', V.cropRegion(v, R.oppicon), gt.oppChar, `${n} oppicon`, 16, 16);
      dbgAdd(`${n} oppname(表示確認用)`, V.cropRegion(v, R.oppname));
    } else {
      const myIconR = gt.myRow === 1 ? R.dIconL1 : R.dIconL2;
      const paIconR = gt.myRow === 1 ? R.dIconL2 : R.dIconL1;
      harvestIcon('dblIcons', V.cropRegion(v, myIconR), myChar, `${n} my(L${gt.myRow})`, 16, 12);
      if (gt.partnerChar) harvestIcon('dblIcons', V.cropRegion(v, paIconR), gt.partnerChar, `${n} partner`, 16, 12);
      if (gt.opp1Char) harvestIcon('dblIcons', V.cropRegion(v, R.dIconR1), gt.opp1Char, `${n} opp1(R1)`, 16, 12);
      if (gt.opp2Char) harvestIcon('dblIcons', V.cropRegion(v, R.dIconR2), gt.opp2Char, `${n} opp2(R2)`, 16, 12);
      const mynameR = gt.myRow === 1 ? R.dNameL1 : R.dNameL2;
      T.myname.push({ name: 'ガメス', v: Array.from(V.textVec(V.cropRegion(v, mynameR), 32, 8)) });
      dbgAdd(`${n} myname(ガメス)`, V.cropRegion(v, mynameR));
    }

    // 勝敗パネルを直接探索（シーン分類は補助のみ）。lossの場合は黄色行=相手
    {
      const st0 = m.winner ? m.winner.t0 - 1.0 : m.rating.t0 - 26;
      const st1 = m.winner ? m.winner.t1 + 1.0 : m.rating.t0 - 0.5;
      const wloc = await V.locateWinner(v, st0, st1, null);
      if (!wloc) {
        H.errors.push(`${n}: winner panel not found (search ${st0.toFixed(0)}-${st1.toFixed(0)})`);
      } else {
        const winRow = wloc.row;
        const [wd, ld] = winRow === 1 ? [R.w1digit, R.w2digit] : [R.w2digit, R.w1digit];
        const [wi, li] = winRow === 1 ? [R.w1icon, R.w2icon] : [R.w2icon, R.w1icon];
        if (gt.win) harvestText('panelFont', V.cropRegion(v, wd), 'inkonyellow', [gt.win], `${n} 勝者digit(行${winRow})`);
        if (gt.lose) harvestText('panelFont', V.cropRegion(v, ld), 'lightink', [gt.lose], `${n} 敗者digit`);
        if (!isDbl) {
          const winnerChar = gt.result === 'loss' ? gt.oppChar : myChar;
          const loserChar  = gt.result === 'loss' ? myChar : gt.oppChar;
          harvestIcon('panelIcons', V.cropRegion(v, wi), winnerChar, `${n} 勝者icon`, 16, 16);
          harvestIcon('panelIcons', V.cropRegion(v, li), loserChar, `${n} 敗者icon`, 16, 16);
        }
      }
    }

    await seekTo(m.rating.t0 + 0.6);
    harvestText('ratingFont', V.cropRegion(v, R.rating), 'fillink', gt.before.split(''), `${n} rating-before`);
    if (gt.rankEarly) harvestText('ratingFont', V.cropRegion(v, R.ranking), 'fillink', gt.rankEarly.split(''), `${n} rank-early`);
    if (i === 0) {
      harvestIcon('mode1', V.cropRegion(v, R.mode1), isDbl ? 'ダブルス' : 'シングルス', `${n} mode1`, 24, 8);
      harvestIcon('mode2', V.cropRegion(v, R.mode2), set.fever ? 'あり' : 'なし', `${n} mode2`, 32, 8);
    }
    await seekTo(m.rating.t1 - 0.5);
    harvestText('ratingFont', V.cropRegion(v, R.rating), 'fillink', gt.after.split(''), `${n} rating-after`);
    if (gt.rankStable) harvestText('ratingFont', V.cropRegion(v, R.ranking), 'fillink', gt.rankStable.split(''), `${n} rank-stable`);
    // フィーバー: 発動バナーを収集し、ゲージ帰属×DBのラケット登録でラベル付け
    if (set.fever && (gt.myRacket || gt.oppRacket)) {
      const evs = await V.collectBanners(v, m.vs.t1 + 12, m.rating.t0 - 6, {});
      for (const e of evs) {
        const label = e.side === 'me' ? gt.myRacket : e.side === 'opp' ? gt.oppRacket : null;
        log(`${n} banner@${e.t.toFixed(0)} side=${e.side ?? '?'} dropL=${e.dropL} dropR=${e.dropR} → ${label ?? 'skip'}`);
        if (!label) continue;
        for (const p of e.profiles) T.racketBanners.push({ name: label, profile: p });
      }
    }
    log(`${n} harvested`);
  }
  await dbgFlush(`harvest_debug_v${vi}.png`);
}

async function run() {
  try {
    // ?only=6,7 で差分収穫: 既存templates.jsonを読み込んだ上で指定動画だけ収穫する
    const p = new URLSearchParams(location.search);
    const only = p.get('only') ? p.get('only').split(',').map(Number) : null;
    if (only) {
      const res = await fetch('/samples/frames/templates.json');
      const j = await res.json();
      for (const [k, arr] of Object.entries(j.sets)) if (T[k]) T[k].push(...arr);
      log('差分モード: 既存テンプレ読込 ' + Object.entries(T).map(([k, a]) => `${k}=${a.length}`).join(' '));
    }
    for (let vi = 0; vi < SETS.length; vi++) {
      if (only && !only.includes(vi + 1)) continue;
      H.phase = `video${vi + 1}`;
      await harvestVideo(SETS[vi], vi + 1);
    }
    H.phase = 'save';
    const counts = Object.fromEntries(Object.entries(T).map(([k, a]) => [k, a.length]));
    await saveJson('templates.json', { createdAt: '2026-08-20', videos: SETS.map(s => s.src), glyphSize: [V.TW, V.TH], sets: T });
    log('saved templates.json: ' + JSON.stringify(counts));
    H.counts = counts;
    H.phase = 'done'; H.done = true;
  } catch (e) {
    H.errors.push(String(e && e.stack || e));
    H.phase = 'error';
    log('ERROR: ' + e);
  }
}
run();
