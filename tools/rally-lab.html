<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SENSEKI SCAN — ラリー解析ラボ</title>
<style>
  :root { --bg:#0f1613; --panel:#17211c; --border:#2a3a32; --text:#e4ede8; --sub:#8fa89b; --accent:#2ecc71; --accent-dark:#1f9d4d; --warn:#e74c3c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Segoe UI","Yu Gothic UI",sans-serif; padding:16px; }
  h1 { font-size:18px; color:var(--accent); margin-bottom:4px; }
  .mark { vertical-align:-4px; margin-right:7px; }
  .sub { color:var(--sub); font-size:12px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:12px; }
  #drop { border:2px dashed var(--border); border-radius:10px; padding:22px; text-align:center; color:var(--sub); cursor:pointer; margin-bottom:12px; }
  #drop.over { border-color:var(--accent); background:#1a2b22; }
  #drop.loaded { padding:8px 12px; font-size:12px; text-align:left; }
  button { background:#223129; color:var(--text); border:1px solid var(--border); border-radius:7px; padding:8px 14px; font-size:13px; cursor:pointer; }
  button.primary { background:var(--accent-dark); border-color:var(--accent-dark); font-weight:bold; }
  button:disabled { opacity:.4; cursor:default; }
  label.f { display:inline-block; font-size:11px; color:var(--sub); margin-right:10px; }
  label.f input { width:82px; background:#0c130f; color:var(--text); border:1px solid var(--border); border-radius:5px; padding:4px 6px; font-size:12px; margin-left:4px; }
  table { border-collapse:collapse; width:100%; font-size:12px; }
  th, td { border-bottom:1px solid var(--border); padding:5px 7px; text-align:left; }
  th { color:var(--sub); font-weight:normal; font-size:11px; }
  td.num { font-family:Consolas,monospace; }
  tr.me td.win { color:var(--accent); }
  tr.opp td.win { color:#e8a33d; }
  tr.bad td { color:var(--warn); }
  #strip { display:flex; gap:1px; flex-wrap:wrap; margin-top:8px; }
  #strip i { width:5px; height:16px; display:block; }
  #bar { height:6px; background:#101a15; border-radius:3px; overflow:hidden; margin-top:6px; }
  #bar div { height:100%; width:0%; background:var(--accent-dark); transition:width .2s; }
  #log { font:11px Consolas,monospace; color:var(--sub); white-space:pre-wrap; max-height:180px; overflow-y:auto; margin-top:8px; }
  .kv { font:11px Consolas,monospace; color:var(--sub); }
  video { display:none; }
</style>
</head>
<body>
<h1><svg class="mark" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/><path d="M3 12h18" stroke="currentColor" stroke-width="1" opacity=".35"/><path d="M8 4v16M16 4v16" stroke="currentColor" stroke-width="1" opacity=".2"/><path d="M1.5 8.5h21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>ラリー解析ラボ <span class="sub">Phase A — 得点HUDからポイント境界を取る</span></h1>
<p class="sub" style="margin-bottom:12px">得点ピップ（テニスボール7個・デュース時は2個）の在否でポイントの切れ目を検出します。点灯数の増減では数えません。</p>

<div id="drop">録画ファイル（MP4）をドラッグ&ドロップ、またはクリックして選択</div>
<input type="file" id="file" accept="video/*" hidden>

<div class="panel">
  <div style="margin-bottom:8px">
    <label class="f">開始秒<input id="t0" type="number" value="0" step="1"></label>
    <label class="f">終了秒<input id="t1" type="number" value="0" step="1"></label>
    <label class="f">刻み秒<input id="step" type="number" value="0.2" step="0.05"></label>
    <button class="primary" id="run" disabled>ポイント境界を検出</button>
    <button id="probe" disabled>現在フレームを1回読む</button>
  </div>
  <div id="probeOut" class="kv"></div>
  <div id="bar"><div></div></div>
  <div id="log"></div>
</div>

<div class="panel" id="resultPanel" style="display:none">
  <div id="summary" class="sub" style="margin-bottom:8px"></div>
  <table id="tbl"><thead><tr>
    <th>#</th><th>ラリー終了(s)</th><th>空白(s)</th><th>直前スコア</th><th>確定スコア</th><th>取った側</th><th>決め球の探索窓(s)</th>
  </tr></thead><tbody></tbody></table>
  <div class="sub" style="margin-top:10px">タイムライン（緑=HUD点灯 / 赤=消灯 / 灰=読み取り不能）</div>
  <div id="strip"></div>
</div>

<div class="panel">
  <div style="margin-bottom:8px">
    <strong style="font-size:13px;color:var(--accent)">Phase C — ボール追跡と着弾点</strong>
    <span class="sub" style="margin-left:8px">ラリー1本分の区間を指定して走査します</span>
  </div>
  <div style="margin-bottom:8px">
    <label class="f">開始秒<input id="ct0" type="number" value="386.3" step="0.1"></label>
    <label class="f">終了秒<input id="ct1" type="number" value="387.9" step="0.1"></label>
    <button class="primary" id="runC" disabled>着弾点を検出</button>
  </div>
  <div id="cbar" style="height:6px;background:#101a15;border-radius:3px;overflow:hidden"><div style="height:100%;width:0%;background:var(--accent-dark);transition:width .2s"></div></div>
  <div id="clog" class="kv" style="margin-top:8px"></div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:10px">
    <svg id="courtSvg" width="300" height="420" style="background:#101a15;border:1px solid var(--border);border-radius:8px"></svg>
    <div style="flex:1;min-width:260px">
      <table id="btbl"><thead><tr><th>#</th><th>時刻(s)</th><th>種別</th><th>X(m)</th><th>Z(m)</th><th>側</th><th>コート内</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<video id="video" muted preload="auto"></video>

<script src="vision.js"></script>
<script src="rally.js"></script>
<script src="court.js"></script>
<script src="ball.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video');
const log = m => { $('log').textContent += m + '\n'; $('log').scrollTop = 1e9; };

const drop = $('drop');
drop.addEventListener('click', () => $('file').click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) loadFile(f); });
$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); });

function loadFile(f) { load(URL.createObjectURL(f), f.name); }
function load(src, name) {
  video.src = src;
  video.addEventListener('loadedmetadata', () => {
    drop.classList.add('loaded');
    drop.textContent = `${name} — ${video.videoWidth}x${video.videoHeight} / ${video.duration.toFixed(1)}秒`;
    $('t1').value = Math.floor(video.duration);
    $('run').disabled = false; $('probe').disabled = false; $('runC').disabled = false;
    log(`読み込み完了: ${video.videoWidth}x${video.videoHeight} ${video.duration.toFixed(2)}秒`);
  }, { once: true });
}

// ?src= 指定で自動読み込み（開発用）
const p = new URLSearchParams(location.search);
if (p.get('src')) load(p.get('src'), p.get('src').split('/').pop());

$('probe').addEventListener('click', () => {
  const h = Rally.readHud(video);
  const f = s => `mode=${s.mode ?? '-'} lit=${s.lit} adv=${s.adv} fill=${s.fill.toFixed(2)} numW=${s.numW} slots=[${s.slots.map(v => v ?? '.').join('')}]`;
  $('probeOut').innerHTML =
    `t=${video.currentTime.toFixed(3)}  hudOn=${h.hudOn}  score=${Rally.scoreLabel(h)}<br>` +
    `L: ${f(h.L)}<br>R: ${f(h.R)}`;
});

$('run').addEventListener('click', async () => {
  $('run').disabled = true; $('log').textContent = '';
  const t0 = +$('t0').value, t1 = +$('t1').value, step = +$('step').value;
  const started = performance.now();
  log(`走査開始 ${t0}〜${t1}秒 / 刻み${step}秒 (${Math.round((t1 - t0) / step)}フレーム)`);

  const { timeline, points, boundaries } = await Rally.scanPoints(video, {
    t0, t1, step,
    onProgress: (t) => { $('bar').firstElementChild.style.width = ((t - t0) / (t1 - t0) * 100).toFixed(1) + '%'; },
  });

  const secs = ((performance.now() - started) / 1000).toFixed(1);
  const onCnt = timeline.filter(x => x.hudOn).length;
  log(`完了 ${secs}秒 / HUD点灯 ${onCnt}/${timeline.length}フレーム`);

  const other = boundaries.filter(b => b.kind === 'other');
  $('summary').textContent =
    `ポイント ${points.length}件 / 規格外の空白 ${other.length}件（1.2〜4.5秒の外＝演出・ゲーム間・試合終了）/ 走査 ${secs}秒`;

  const tb = $('tbl').querySelector('tbody');
  tb.innerHTML = '';
  points.forEach((pt, i) => {
    const w = Rally.winnerShotWindow(pt);
    const cls = pt.winner ?? 'bad';
    tb.insertAdjacentHTML('beforeend',
      `<tr class="${cls}"><td>${i + 1}</td><td class="num">${pt.rallyEnd.toFixed(2)}</td>` +
      `<td class="num">${(pt.gapEnd - pt.rallyEnd).toFixed(2)}</td>` +
      `<td>${pt.scoreBefore}</td><td>${pt.scoreAfter}</td>` +
      `<td class="win">${pt.winner === 'me' ? '自分' : pt.winner === 'opp' ? '相手' : '不明'}</td>` +
      `<td class="num">${w.from.toFixed(2)} 〜 ${w.to.toFixed(2)}</td></tr>`);
  });

  const strip = $('strip'); strip.innerHTML = '';
  timeline.forEach(x => {
    const c = x.hudOn ? '#1f9d4d' : (x.L.fill > 0.1 || x.R.fill > 0.1 ? '#e74c3c' : '#3a4a42');
    strip.insertAdjacentHTML('beforeend', `<i style="background:${c}" title="${x.t}s"></i>`);
  });
  $('resultPanel').style.display = '';
  $('run').disabled = false;
});

// ---- Phase C: ボール追跡と着弾点 ----
// コート俯瞰図（NBAのショットチャート相当）。原点=ネット中央・X=右・Z=奥
function drawCourt(bounces) {
  const svg = $('courtSvg'), W = 300, H = 420, PAD = 26;
  const XM = Court.X_DBL, ZM = Court.Z_BASE;
  const px = X => PAD + (X + XM) / (2 * XM) * (W - 2 * PAD);
  const py = Z => PAD + (ZM - Z) / (2 * ZM) * (H - 2 * PAD);
  const line = (x1, y1, x2, y2, w, o) =>
    `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8fa89b" stroke-width="${w}" opacity="${o}"/>`;
  let s = '';
  s += `<rect x="${px(-XM)}" y="${py(ZM)}" width="${px(XM) - px(-XM)}" height="${py(-ZM) - py(ZM)}" fill="#16241c" stroke="#8fa89b" stroke-width="1.4" opacity=".9"/>`;
  s += line(px(-Court.X_SGL), py(ZM), px(-Court.X_SGL), py(-ZM), 1, .45);
  s += line(px(Court.X_SGL), py(ZM), px(Court.X_SGL), py(-ZM), 1, .45);
  s += line(px(-Court.X_SGL), py(Court.Z_SVC), px(Court.X_SGL), py(Court.Z_SVC), 1, .45);
  s += line(px(-Court.X_SGL), py(-Court.Z_SVC), px(Court.X_SGL), py(-Court.Z_SVC), 1, .45);
  s += line(px(0), py(Court.Z_SVC), px(0), py(-Court.Z_SVC), 1, .35);
  s += `<line x1="${px(-XM)}" y1="${py(0)}" x2="${px(XM)}" y2="${py(0)}" stroke="#2ecc71" stroke-width="2.5"/>`;
  s += `<text x="${W / 2}" y="14" fill="#8fa89b" font-size="9" text-anchor="middle">相手コート</text>`;
  s += `<text x="${W / 2}" y="${H - 5}" fill="#8fa89b" font-size="9" text-anchor="middle">自分コート</text>`;
  bounces.forEach((b, i) => {
    if (b.X == null) return;
    const c = b.inCourt ? '#2ecc71' : '#e74c3c';
    s += `<circle cx="${px(b.X)}" cy="${py(b.Z)}" r="6" fill="${c}" fill-opacity=".35" stroke="${c}" stroke-width="1.6"/>`;
    s += `<text x="${px(b.X)}" y="${py(b.Z) - 9}" fill="${c}" font-size="9" text-anchor="middle">${i + 1}</text>`;
  });
  svg.innerHTML = s;
}

$('runC').addEventListener('click', async () => {
  $('runC').disabled = true;
  const t0 = +$('ct0').value, t1 = +$('ct1').value, dt = 1 / 60;
  const seek = Vision.makeSeeker(video);
  const bar = $('cbar').firstElementChild;
  const frames = [];
  let prevMask = null, cam = null, net = null, i = 0;
  const started = performance.now();
  for (let t = t0; t <= t1; t += dt, i++) {
    await seek(t);
    const img = Court.frame(video);
    if (i % 15 === 0) {
      const e = Court.estimate(video);
      if (e.ok && !e.suspect) {
        cam = e;
        const base = Court.toScreen(0, 0, cam).y, u = 1 / cam.c0, hpx = 0.91 * u / cam.Yc;
        net = { y0: (base - hpx * 1.25) / 2, y1: (base + 12) / 2 };
      }
    }
    const cs = BallTrack.candidates(img, { prevMask });
    prevMask = cs.mask;
    const keep = cs.filter(c => c.overlap < 0.6 && (!net || c.y < net.y0 || c.y > net.y1));
    frames.push({ t: +t.toFixed(4), c: keep.map(c => [c.x, c.y, c.n, c.fill, c.rg]) });
    bar.style.width = ((t - t0) / (t1 - t0) * 100).toFixed(1) + '%';
  }
  const chains = BallTrack.buildChains(frames);
  const ranked = BallTrack.pickBall(chains, { net });
  const segs = BallTrack.ballSegments(ranked);
  const bs = BallTrack.bounces(segs, cam);
  const secs = ((performance.now() - started) / 1000).toFixed(1);

  $('clog').innerHTML =
    `${frames.length}フレーム / 候補 ${frames.reduce((s, f) => s + f.c.length, 0)}個 / 鎖 ${chains.length}本 → ` +
    `ボール区間 ${segs.length}本 / 着弾候補 ${bs.length}件 （${secs}秒）<br>` +
    (cam ? `カメラ: Yc=${cam.Yc.toFixed(2)}m Xc=${cam.Xc.toFixed(2)}m（交差検証 ${(cam.agree * 100).toFixed(1)}%）` : 'カメラ推定に失敗');

  const tb = $('btbl').querySelector('tbody');
  tb.innerHTML = '';
  bs.forEach((b, i) => tb.insertAdjacentHTML('beforeend',
    `<tr><td>${i + 1}</td><td class="num">${b.t.toFixed(3)}</td><td>${b.kind === 'segment-end' ? '区間終端' : '反転'}</td>` +
    `<td class="num">${b.X ?? '-'}</td><td class="num">${b.Z ?? '-'}</td>` +
    `<td>${b.side === 'me' ? '自分' : '相手'}</td><td>${b.inCourt ? 'イン' : 'アウト'}</td></tr>`));
  drawCourt(bs);
  $('runC').disabled = false;
});
</script>
</body>
</html>
